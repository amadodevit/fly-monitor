[project]
name = "fly-monitor"
version = "0.1.0"
description = "Monitor anything from one place: plug in sources, see what needs attention."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "textual>=8.2.8",
]

[project.scripts]
fly-monitor = "fly_monitor.cli:main"

# Source plugins register here. Third-party plugins use the same group.
[project.entry-points."fly_monitor.sources"]
github = "fly_monitor.plugins.github:GitHubSource"
website = "fly_monitor.plugins.website:WebsiteSource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
