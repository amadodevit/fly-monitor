[project]
name = "watchkeep"
version = "0.1.0"
description = "Monitor anything from one place: plug in sources, see what needs attention."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "textual>=8.2.8",
]

[project.scripts]
watchkeep = "watchkeep.cli:main"

# Source plugins register here. Third-party plugins use the same group.
[project.entry-points."watchkeep.sources"]
github = "watchkeep.plugins.github:GitHubSource"
website = "watchkeep.plugins.website:WebsiteSource"
activemq = "watchkeep.plugins.activemq:ActiveMQSource"
feeds = "watchkeep.plugins.feeds:FeedsSource"

[project.optional-dependencies]
feeds = [
    "anthropic>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
