[project]
name = "fly-monitor-disk"
version = "0.1.0"
description = "Example fly-monitor plugin: disk usage per mount point."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fly-monitor"]

# This line is what makes fly-monitor find the plugin.
[project.entry-points."fly_monitor.sources"]
disk = "fly_monitor_disk:DiskSource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_monitor_disk"]
